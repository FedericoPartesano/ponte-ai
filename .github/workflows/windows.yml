name: Rilascio

# Si avvia da solo quando si pubblica un tag v*, oppure a mano indicando il tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v0.1.3)"
        required: true

permissions:
  contents: write

jobs:
  costruisci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:linux
        if: runner.os == 'Linux'
        working-directory: app
      - run: npm run dist
        if: runner.os == 'Windows'
        working-directory: app
      - name: Carica sulla release
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Ponte AI ${TAG#v}" --notes "Ponte AI ${TAG#v}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            gh release upload "$TAG" app/dist/ponte-ai-*-linux-x86_64.AppImage --clobber
          else
            # Il launcher su Windows accetta solo .msi o *-windows-x64-portable.zip
            for f in app/dist/ponte-ai-*-windows-x64.zip; do mv "$f" "${f%.zip}-portable.zip"; done
            gh release upload "$TAG" app/dist/ponte-ai-*-windows-x64.exe app/dist/ponte-ai-*-windows-x64-portable.zip --clobber
          fi

  somme:
    needs: costruisci
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: SHA256SUMS.txt (il launcher trova i file da qui)
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "ponte-ai-*"
          sha256sum ponte-ai-* > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
